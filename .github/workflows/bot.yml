name: Run Minecraft Bedrock Bot Server

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Node.js Runtime Environment
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Initialize App Directories
      run: |
        npm init -y
        mkdir -p uuid
        mkdir -p world_save

    # Restores files automatically so your world is never overwritten or wiped
    - name: Restore World and Login Cache
      uses: actions/cache@v4
      with:
        path: |
          ./uuid
          ./world_save
        key: minecraft-world-save-cache

    - name: Install Bedrock Protocol Dependencies
      run: npm install bedrock-protocol

    - name: Launch Bot Server Into Cloud
      run: node bot.js
