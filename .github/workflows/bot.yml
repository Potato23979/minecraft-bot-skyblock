name: Launch Free Macro Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-node: '20'

    - name: Install Dependencies
      run: npm install

    - name: Start Minecraft Bot
      run: |
        # Allow the process to bypass network restrictions
        sudo prlimit --pid=$$ --nofile=65535:65535
        node bot.js
