name: Run Minecraft Bedrock Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually start/stop the bot with a button click

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Node.js Runtime Environment
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Initialize App Directory
      run: |
        npm init -y
        mkdir -p uuid

    - name: Install Bedrock Protocol Dependencies
      run: npm install bedrock-protocol

    - name: Launch Bot Into Cloud
      run: node bot.js
