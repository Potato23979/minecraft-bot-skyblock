name: Run Minecraft Bedrock Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Node.js Runtime Environment
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Initialize App Directory
      run: |
        npm init -y
        mkdir -p uuid

    - name: Restore Minecraft Login Cache
      uses: actions/cache@v4
      with:
        path: ./uuid
        key: msa-login-token

    # FIX: Explicitly forces the installation of version 1.1.14 to stop the compression bug
    - name: Install Stable Bedrock Protocol
      run: npm install bedrock-protocol@1.1.14

    - name: Launch Bot Into Cloud
      run: node bot.js
